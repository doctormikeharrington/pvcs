<!DOCTYPE html>

            :root {
                --navy: #1f3a5f;
                --bg: #edf2f7;
                --accent: #d69e2e;
                --text: #2d3748;
                --text-light: #5a6675;
                --border: #dde3ea;
            }
            .staticrypt-html, .staticrypt-body { height: 100%; margin: 0; }
            .staticrypt-content {
                min-height: 100%; margin: 0;
                background: linear-gradient(135deg, var(--navy) 0%, #16293f 100%);
                font-family: "Inter","Arial",sans-serif;
                -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
            }
            .staticrypt-page { width: 100%; max-width: 420px; padding: 8vh 20px 0; margin: auto; box-sizing: border-box; }
            .staticrypt-form {
                position: relative; z-index: 1; background:#fff; margin: 0 auto;
                padding: 48px 40px 40px; text-align: center; border-radius: 10px;
                box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            }
            .pvcs-logo { font-family:"Source Serif 4",Georgia,serif; font-weight:700; font-size:3rem; letter-spacing:.06em; color:var(--navy); line-height:1; margin:0; }
            .pvcs-subtitle { font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--text-light); margin:12px 0 0; }
            .pvcs-divider { width:48px; height:3px; background:var(--accent); border:0; margin:22px auto; }
            .staticrypt-instructions { margin:0 0 22px; }
            .staticrypt-instructions p { font-size:.95rem; color:var(--text-light); margin:0; }
            .staticrypt-password-container { position:relative; background:#f4f6f9; width:100%; border:1px solid var(--border); border-radius:6px; margin:0 0 16px; box-sizing:border-box; }
            .staticrypt-form input[type="password"], .staticrypt-form input[type="text"] {
                background:inherit; border:0; border-radius:6px; box-sizing:border-box; font-size:16px; outline:0; padding:15px 44px 15px 16px; width:100%; color:var(--text);
            }
            .staticrypt-toggle-password-visibility { cursor:pointer; height:18px; opacity:.55; padding:14px; position:absolute; right:0; top:50%; transform:translateY(-50%); width:18px; }
            label.staticrypt-remember { display:flex; align-items:center; justify-content:center; font-size:.85rem; color:var(--text-light); margin-bottom:18px; }
            .staticrypt-remember input[type="checkbox"] { transform:scale(1.2); margin-right:.6em; accent-color:var(--navy); }
            .staticrypt-form .staticrypt-decrypt-button {
                text-transform:uppercase; letter-spacing:.08em; font-weight:600; outline:0; background:var(--navy);
                width:100%; border:0; border-radius:6px; padding:15px; color:#fff; font-size:14px; cursor:pointer; transition:filter .2s ease;
            }
            .staticrypt-form .staticrypt-decrypt-button:hover, .staticrypt-form .staticrypt-decrypt-button:active, .staticrypt-form .staticrypt-decrypt-button:focus { filter:brightness(112%); }
            .pvcs-footnote { margin:26px 0 0; font-size:.72rem; color:rgba(255,255,255,.7); text-align:center; }
            .hidden { display:none !important; }
            .staticrypt-spinner-container { height:100%; display:flex; align-items:center; justify-content:center; }
            .staticrypt-spinner { display:inline-block; width:2rem; height:2rem; border:.25em solid gray; border-right-color:transparent; border-radius:50%; animation:spinner-border .75s linear infinite; }
            @keyframes spinner-border { 100% { transform: rotate(360deg); } }
</style>
